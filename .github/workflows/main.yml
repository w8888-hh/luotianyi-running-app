name: Build Web to APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Cordova CLI
        run: npm install -g cordova
      - name: Create Cordova Project and Copy Files
        run: |
          cordova create apk-project com.luotianyi.run LuoTianYiRun
          cp index.html apk-project/www/
          cp -r assets apk-project/www/ || true
          cp -r core apk-project/www/ || true
          cp -r voices apk-project/www/ || true
      - name: Build Android APK
        run: |
          cd apk-project
          cordova platform add android
          cordova build android
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuoTianYi-Run-APK
          path: apk-project/platforms/android/app/build/outputs/apk/debug/app-debug.apk
